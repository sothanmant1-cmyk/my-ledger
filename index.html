<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#034f46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>My Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ffffeb;--card:#fffff6;--tx:#1a1a1a;--mu:#666666;--bd:#e4e4d0;--lav:#f0d7ff;--or:#ffa946;--gr:#034f46;--grx:#ffffeb;--wine:#7f1c34;--fill:#034f46;--inc:#034f46;--st:#e4e4d0;--pa:#a35200}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a1a;--card:#242422;--tx:#ffffeb;--mu:#a8a894;--bd:#3a3a33;--wine:#ff9aa8;--fill:#f0d7ff;--inc:#6fd3b8;--st:#3a3a33;--pa:#ffa946}}
:root[data-theme="dark"]{--bg:#1a1a1a;--card:#242422;--tx:#ffffeb;--mu:#a8a894;--bd:#3a3a33;--wine:#ff9aa8;--fill:#f0d7ff;--inc:#6fd3b8;--st:#3a3a33;--pa:#ffa946}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 120px}
h1{font-family:"EB Garamond",Georgia,serif;font-size:38px;line-height:1;margin:4px 0 14px;font-weight:500;letter-spacing:-.5px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:32px;padding:12px 14px;margin-bottom:14px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:10px 2px;border:1px solid var(--bd);background:transparent;color:var(--mu);border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--lav);border-color:var(--tx);color:#1a1a1a;font-weight:600}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;padding:13px 18px;font:inherit;font-size:17px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:999px}
input:focus-visible,button:focus-visible{outline:2px solid var(--or);outline-offset:1px}
.send{padding:0 24px;border:1px solid var(--tx);background:var(--lav);color:#1a1a1a;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.rl{display:none;margin:8px 2px 0;font-size:14px;color:var(--mu)}
#hint{min-height:20px;margin:6px 2px 0;font-size:13px;color:var(--wine)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:4px;padding:6px;background:#1a1a1a;border:1px solid rgba(255,255,235,.18);border-radius:999px;margin:0}
.tabs button{background:none;border:0;padding:10px 18px;border-radius:999px;font:inherit;font-size:15px;color:#ffffeb;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--lav);color:#1a1a1a;font-weight:600}
.pan{background:var(--gr);color:var(--grx);border-radius:36px;padding:22px;margin-bottom:14px}
.pan small{display:block;color:rgba(255,255,235,.7);font-size:12px}
.pan .bt input{background:rgba(255,255,235,.1);border-color:rgba(255,255,235,.3);color:var(--grx)}
.bt{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bt input{flex:0 0 130px;text-align:right;font-size:18px;font-weight:700;padding:8px 10px}
.bar{height:12px;border-radius:6px;background:rgba(255,255,235,.18);overflow:hidden;display:flex;margin:14px 0 12px}
.bar i{display:block;height:100%}.bar .s{background:var(--or)}.bar .p{background:var(--lav)}
.bn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bn b{font-size:18px;font-variant-numeric:tabular-nums}
.bn .over b{color:var(--or)}
.big{font-family:"EB Garamond",Georgia,serif;font-size:52px;line-height:1.1;margin:2px 0 12px}
.sub{margin-top:12px;font-size:14px}
.sec{margin:20px 2px 4px;font-family:"EB Garamond",Georgia,serif;font-size:24px;font-weight:500}
.item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--bd)}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item .d{display:block;font-size:12px;color:var(--mu)}
.cat{display:inline-block;background:var(--lav);color:#1a1a1a;border-radius:999px;padding:1px 8px;font-size:11px;margin-right:6px}
.amt{font-weight:600;font-variant-numeric:tabular-nums}
.amt.e{color:var(--wine)}.amt.i{color:var(--inc)}.amt.p{color:var(--pa)}
.pay{border:1px solid var(--tx);background:var(--lav);color:#1a1a1a;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.x{background:none;border:0;color:var(--mu);font-size:22px;cursor:pointer;padding:0;min-width:40px;min-height:40px}
.done .t{text-decoration:line-through;color:var(--mu)}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--gr)}
.empty{color:var(--mu);padding:14px 4px}
.mn{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px;font-weight:600}
.cb{margin:10px 2px}
.cb div{display:flex;justify-content:space-between;font-size:14px}
.cb i{display:block;height:8px;border-radius:4px;background:var(--bd);margin-top:4px;overflow:hidden}
.cb i b{display:block;height:100%;background:var(--fill)}
.tr{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:6px;padding:9px 2px;border-bottom:1px solid var(--bd);font-size:13px;font-variant-numeric:tabular-nums}
.tr.th{color:var(--mu)}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.c{border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:2px;min-height:112px;color:#1a1a1a}
.c small{font-size:12px;opacity:.75}
.c b{font-family:"EB Garamond",Georgia,serif;font-size:28px;font-weight:500;line-height:1.1;margin-top:4px}
.c span{font-size:12px;opacity:.75;margin-top:auto}
.c1{background:var(--lav)}.c2{background:var(--st);color:var(--tx)}.c3{background:var(--or)}.c4{background:#1a1a1a;color:#ffffeb;border:1px solid rgba(255,255,235,.2)}
.dc{display:flex;align-items:flex-end;gap:3px;height:110px;margin:10px 2px 4px}
.dc i{flex:1;background:var(--fill);border-radius:4px 4px 0 0}
.dl{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin:0 2px}
.pan.ink{background:#1a1a1a;border:1px solid rgba(255,255,235,.18);border-radius:40px}
.pan.ink .big{color:var(--lav)}
.sn{display:flex;gap:4px;margin:0 0 14px}
.sn button{flex:1;min-width:0;padding:9px 2px;border:1px solid var(--bd);background:transparent;color:var(--mu);border-radius:999px;font:inherit;font-size:12.5px;cursor:pointer}
.sn button.on{background:var(--lav);border-color:var(--tx);color:#1a1a1a;font-weight:600}
.tr.t5{grid-template-columns:1.2fr 1fr 1fr 1fr 1.1fr;font-size:12px}
.gb{height:12px;border-radius:6px;background:var(--bd);overflow:hidden;margin-top:12px}
.gb i{display:block;height:100%;background:var(--fill)}
.lb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;min-width:0}
.dc .lb i{flex:none;width:100%}
.lb small{font-size:9px;color:var(--mu);white-space:nowrap}
.lb span{font-size:11px;color:var(--mu)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bkb{padding:8px 16px;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
#bkp textarea{width:100%;min-height:72px;margin:8px 0;padding:10px 14px;font:inherit;font-size:13px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:18px;resize:vertical}
.bkr{display:flex;gap:6px;flex-wrap:wrap}
.pan input::placeholder{color:rgba(255,255,235,.6)}
.tr span+span{text-align:right}
button:active{opacity:.7}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(110px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 70%);pointer-events:none;z-index:4}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;display:none;align-items:center;gap:14px;background:var(--tx);color:var(--bg);padding:8px 8px 8px 18px;border-radius:999px;font-size:14px;white-space:nowrap}
.toast button{background:var(--lav);color:#1a1a1a;border:0;border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
<div class="hd"><h1>My Ledger</h1><button class="bkb" onclick="bkTog()">Backup</button></div>
<div class="box" id="bkp" style="display:none">
  <div class="sec" style="margin:0">Backup and restore</div>
  <div class="sub" id="bkinfo" style="margin-top:4px;color:var(--mu)"></div>
  <textarea id="bkt" placeholder="Your backup text shows here. To restore, paste a backup here and tap Restore."></textarea>
  <div class="bkr">
    <button class="pay" onclick="bkCopy()">Copy backup</button>
    <button class="pay" onclick="bkFile()">Save file</button>
    <button class="pay" onclick="bkRestore($('#bkt').value)">Restore</button>
    <button class="pay" onclick="$('#bkf').click()">Restore file</button>
  </div>
  <input type="file" id="bkf" accept=".json,application/json" style="display:none" onchange="bkPick(this)">
</div>
<div class="box">
  <div class="seg" id="seg">
    <button data-t="expense" class="on">Expense</button>
    <button data-t="planned">Planned</button>
    <button data-t="income">Income</button>
    <button data-t="todo">To-do</button>
  </div>
  <div class="row">
    <input type="text" id="in" placeholder="What do you want?" autocomplete="off" enterkeyhint="send">
    <button class="send" id="go">Send</button>
  </div>
  <label class="rl" id="repl"><input type="checkbox" id="rep" checked> Repeat every month</label>
  <div id="hint" role="status"></div>
</div>
<div class="tabs" id="tabs">
  <button data-tab="money" class="on">Money</button>
  <button data-tab="insights">Insights</button>
  <button data-tab="todo">To-do</button>
</div>
<div id="view"></div>
</main>
<div class="toast" id="toast" role="status"><span>Deleted</span><button onclick="undo()">Undo</button></div>
<script>
var K = 'ledger_v1', BK = 'ledger_budgets', OB = 'ledger_budget', items = [], budgets = {}, type = 'expense', tab = 'money', seq = 0;
function pad(m) { return String(m).replace(/-(\d)$/, '-0$1'); }
function mkey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
function im(i) { return pad(i.mk || mkey(i.ts)); }
var cur = mkey(Date.now()), vm = cur;
try { items = JSON.parse(localStorage.getItem(K) || '[]'); } catch (e) { items = []; }
try { budgets = JSON.parse(localStorage.getItem(BK) || '{}'); } catch (e) { budgets = {}; }
try { var ob = Number(localStorage.getItem(OB)); if (ob && budgets[cur] == null) budgets[cur] = ob; } catch (e) {}
function save() { try { localStorage.setItem(K, JSON.stringify(items)); localStorage.setItem(BK, JSON.stringify(budgets)); localStorage.setItem('ledger_goal', String(goal)); } catch (e) {} }
function $(s) { return document.querySelector(s); }
function fmt(n) { n = Math.round(Number(n) * 100) / 100; return (n < 0 ? '−' : '') + '₹' + Math.abs(n).toLocaleString('en-IN'); }
function dt(ts) { return new Date(ts).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); }
function mname(m) { return new Date(+m.slice(0, 4), +m.slice(5) - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }); }
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function getBud(m) {
  if (budgets[m] != null) return budgets[m];
  var ks = Object.keys(budgets).filter(function (k) { return k <= m; }).sort();
  return ks.length ? budgets[ks[ks.length - 1]] : 0;
}
var CATS = [
  ['Travel', /uber|\bola\b|rapido|\bauto\b|\bcab\b|metro|\bbus\b|train|petrol|fuel|flight/],
  ['Food', /swiggy|zomato|food|lunch|dinner|breakfast|coffee|chai|snack|restaurant|cafe/],
  ['Groceries', /grocer|blinkit|zepto|instamart|milk|veg/],
  ['AI & apps', /claude|chatgpt|\bgpt\b|openai|cursor|gemini|\bai\b|netflix|spotify|youtube|subscription|\bapps?\b/],
  ['Bills', /\brent\b|wifi|electric|recharge|\bbill|\bemi\b|insurance/],
  ['Shopping', /amazon|flipkart|myntra|shop|clothes|shoes/]
];
function cat(t) {
  t = t.toLowerCase();
  for (var i = 0; i < CATS.length; i++) if (CATS[i][1].test(t)) return CATS[i][0];
  return 'Other';
}
function catOf(i) { return i.cat || cat(i.text); }
var hints = { expense: 'Uber 300', planned: 'Claude 1800', income: 'Salary 80000', todo: 'Call mom at 5:00' };

function ensureMonth() {
  var seen = {}, tpl = {}, made = false;
  items.forEach(function (i) {
    if (i.rep && i.src) { seen[i.src] = seen[i.src] || {}; seen[i.src][im(i)] = 1; if (!tpl[i.src]) tpl[i.src] = i; }
  });
  Object.keys(tpl).forEach(function (s) {
    if (!seen[s][cur]) {
      var t = tpl[s];
      items.unshift({ id: Date.now() + (seq++), type: 'planned', text: t.text, cat: t.cat, amount: t.amount, ts: Date.now(), mk: cur, src: t.src, rep: true });
      made = true;
    }
  });
  if (made) save();
}
function stats(m) {
  var s = { inc: 0, exp: 0, plan: 0, cats: {}, top: [] };
  items.forEach(function (i) {
    if (im(i) !== m) return;
    if (i.type === 'income') s.inc += i.amount;
    else if (i.type === 'planned') s.plan += i.amount;
    else if (i.type === 'expense') { s.exp += i.amount; var c = catOf(i); s.cats[c] = (s.cats[c] || 0) + i.amount; s.top.push(i); }
  });
  s.top.sort(function (a, b) { return b.amount - a.amount; });
  return s;
}
function hintEg() { var h = $('#hint'); h.style.color = 'var(--mu)'; h.textContent = 'Example: ' + hints[type]; }
function setType(t) {
  type = t;
  document.querySelectorAll('#seg button').forEach(function (b) { b.classList.toggle('on', b.dataset.t === t); });
  $('#in').placeholder = 'What do you want?'; hintEg();
  $('#repl').style.display = t === 'planned' ? 'block' : 'none';
  setTab(t === 'todo' ? 'todo' : t === 'income' ? 'insights' : 'money');
}
function setTab(t) {
  tab = t;
  document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === t); });
  render();
}
function add() {
  var raw = $('#in').value.trim();
  if (!raw) return;
  var now = Date.now(), it = { id: now, type: type, text: raw, ts: now, mk: cur };
  it.src = it.id;
  if (type !== 'todo') {
    var m = raw.match(/\d[\d,]*(\.\d+)?/);
    if (!m) { $('#hint').style.color = 'var(--wine)'; $('#hint').textContent = 'Add an amount, like “' + hints[type] + '”.'; return; }
    it.amount = parseFloat(m[0].replace(/,/g, ''));
    var tag = raw.match(/#(\w+)/);
    var txt = raw.replace(m[0], '').replace(/#\w+/, '').replace(/\s+/g, ' ').trim();
    it.text = txt || (type === 'income' ? 'Income' : type === 'planned' ? 'Planned' : 'Expense');
    if (type !== 'income') it.cat = tag ? tag[1].charAt(0).toUpperCase() + tag[1].slice(1) : cat(it.text);
    if (type === 'planned') it.rep = $('#rep').checked;
  } else { it.done = false; }
  items.unshift(it);
  save();
  $('#in').value = '';
  hintEg();
  setTab(type === 'todo' ? 'todo' : type === 'income' ? 'insights' : 'money');
  $('#in').focus();
}
var snap = '', tt = 0, lastBk = 0;
try { lastBk = Number(localStorage.getItem('ledger_lastbk')) || 0; } catch (e) {}
function toast(m, u) { $('#toast span').textContent = m; $('#toast button').style.display = u ? '' : 'none'; $('#toast').style.display = 'flex'; clearTimeout(tt); tt = setTimeout(function () { $('#toast').style.display = 'none'; }, 6000); }
function bkData() { return JSON.stringify({ v: 1, items: items, budgets: budgets, goal: goal, at: new Date().toISOString() }); }
function applyData(d) { items = d.items; budgets = d.budgets || {}; goal = Number(d.goal) || 0; save(); }
function undo() { if (snap) { applyData(JSON.parse(snap)); snap = ''; render(); } $('#toast').style.display = 'none'; }
function bkInfo() { $('#bkinfo').textContent = lastBk ? 'Last backup: ' + dt(lastBk) : 'No backup yet'; }
function bkDone() { lastBk = Date.now(); try { localStorage.setItem('ledger_lastbk', String(lastBk)); } catch (e) {} bkInfo(); render(); }
function bkTog(o) { var p = $('#bkp'); p.style.display = (o || p.style.display === 'none') ? 'block' : 'none'; bkInfo(); window.scrollTo(0, 0); }
function bkCopy() {
  var t = bkData(), ta = $('#bkt'), ok = false;
  ta.value = t; ta.select();
  try { ok = document.execCommand('copy'); } catch (e) {}
  if (!ok && navigator.clipboard) { navigator.clipboard.writeText(t).catch(function () {}); ok = true; }
  if (ok) { bkDone(); toast('Backup copied. Paste it somewhere safe.', 0); } else toast('Select the text above and copy it.', 0);
}
function bkFile() {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bkData()], { type: 'application/json' }));
  a.download = 'my-ledger-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); bkDone(); toast('Backup file saved.', 0);
}
function bkRestore(txt) {
  var d; try { d = JSON.parse(txt); } catch (e) { return toast('That is not a valid backup.', 0); }
  if (!d || !Array.isArray(d.items)) return toast('That is not a valid backup.', 0);
  snap = bkData(); applyData(d); ensureMonth(); render(); toast('Backup restored.', 1);
}
function bkPick(inp) { var f = inp.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { bkRestore(String(r.result)); inp.value = ''; }; r.readAsText(f); }
function del(id) {
  snap = bkData(); toast('Deleted', 1);
  var g = items.filter(function (i) { return i.id === id; })[0];
  if (g && g.type === 'planned' && g.rep) items.forEach(function (i) { if (i.src === g.src) i.rep = false; });
  items = items.filter(function (i) { return i.id !== id; });
  save(); render();
}
function tog(id) { items.forEach(function (i) { if (i.id === id) i.done = !i.done; }); save(); render(); }
function pay(id) { items.forEach(function (i) { if (i.id === id) { i.type = 'expense'; i.ts = Date.now(); } }); save(); render(); }
function setBud(v) { budgets[cur] = Number(String(v).replace(/[^\d.]/g, '')) || 0; save(); render(); }
function mv(d) {
  var x = new Date(+vm.slice(0, 4), +vm.slice(5) - 1 + d, 1);
  var k = x.getFullYear() + '-' + ('0' + (x.getMonth() + 1)).slice(-2);
  if (k > cur) return;
  vm = k; render();
}
function row(i, amtHtml, sub) {
  return '<div class="item"><div class="t">' + esc(i.text) + '<span class="d">' + sub + '</span></div>' + amtHtml +
         '<button class="x" aria-label="Delete" onclick="del(' + i.id + ')">×</button></div>';
}
function renderMoney() {
  var s = stats(cur), b = getBud(cur), left = b - s.exp - s.plan, h = '';
  if (items.length > 3 && (!lastBk || Date.now() - lastBk > 2592e6)) h += '<div class="c c1" style="min-height:0;margin-bottom:14px;cursor:pointer" onclick="bkTog(1)"><b style="font-size:18px">Back up your data</b><span style="margin:4px 0 0">' + (lastBk ? 'Your last backup was a while ago.' : 'You have not backed up yet.') + ' Tap here.</span></div>';
  var now = new Date(), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(), dl = dim - now.getDate() + 1;
  var ps = b ? Math.min(100, s.exp / b * 100) : 0, pp = b ? Math.min(100 - ps, s.plan / b * 100) : 0;
  var note = !b ? 'Set your budget above to get started.' : left < 0 ? 'You are over budget. Hold off on new spends.' :
             'You can spend about ' + fmt(Math.floor(left / dl)) + ' a day for the next ' + dl + ' days.';
  h += '<div class="pan"><div class="bt"><label for="bud">Budget · ' + mname(cur).split(' ')[0] + '</label>' +
       '<input type="text" id="bud" inputmode="numeric" placeholder="Set budget" value="' + (budgets[cur] || '') + '" onchange="setBud(this.value)"></div>' +
       '<div class="bar"><i class="s" style="width:' + ps + '%"></i><i class="p" style="width:' + pp + '%"></i></div>' +
       '<div class="bn"><div><small>Spent</small><b>' + fmt(s.exp) + '</b></div><div><small>Planned</small><b>' + fmt(s.plan) + '</b></div>' +
       '<div class="' + (b && left < 0 ? 'over' : '') + '"><small>' + (b && left < 0 ? 'Over by' : 'Left') + '</small><b>' + fmt(b ? Math.abs(left) : 0) + '</b></div></div>' +
